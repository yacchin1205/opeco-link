<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f2f2f7">
    <meta name="description" content="Agent sessions, briefly connected.">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <link rel="stylesheet" href="/styles.css">
    <title>opeco.link</title>
  </head>
  <body>
    <header>
      <a class="brand" href="/">
        <img src="/opeco/outline.svg" width="44" height="44" alt="">
        <span>opeco.link</span>
      </a>
      <div class="header-actions">
        <span id="connection-state" aria-live="polite">準備中</span>
        <button id="open-device-management" class="icon-button" type="button" aria-label="デバイスグループの管理" title="デバイスグループの管理" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 16H3V4h15v4M1 19h13"/><rect x="16" y="9" width="7" height="13" rx="1.5"/><path d="M19 19h1"/></svg>
          <span id="device-count" aria-hidden="true" hidden></span>
        </button>
      </div>
    </header>
    <main>
      <p id="message" role="status" aria-live="polite"></p>
      <section id="startup-error" class="group-card error-card" hidden>
        <p class="card-label">ERROR</p>
        <h2>起動できません</h2>
        <p id="startup-error-message" role="alert"></p>
        <div id="reset-local-data-actions" hidden>
          <p>保存データを削除すると、このブラウザを新しいデバイスとして設定し直せます。保存済みのセッションも削除されます。</p>
          <button id="reset-local-data" class="destructive" type="button">このデバイスのデータをリセット</button>
        </div>
      </section>
      <section id="device-management" class="group-card" hidden>
        <div class="card-head">
          <div>
            <h2>デバイスグループの管理</h2>
          </div>
          <button id="close-device-management" class="icon-button" type="button" aria-label="閉じる" title="閉じる"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
        </div>
        <p id="group-status"></p>
        <h3 class="card-label">GROUP DEVICES</h3>
        <div id="group-devices"></div>
        <p id="group-key-time"></p>
        <hr>
        <p>この端末を、すでに使っている端末と同じグループに追加できます。</p>
        <button id="request-device-sharing" type="button">このデバイスを別のグループに追加</button>
        <button id="leave-device-group" class="destructive" type="button" hidden>このデバイスをグループから除外</button>
      </section>
      <section id="join-device" class="group-card" hidden>
        <p class="card-label">DEVICE GROUP</p>
        <h2>別のグループへの追加待ち</h2>
        <p id="join-device-status"></p>
        <div id="invitation-qr"></div>
        <button id="share-invitation" type="button">グループ追加用リンクを共有</button>
      </section>
      <section id="cards" aria-label="セッション"></section>
      <section id="empty" hidden>
        <div class="empty-mark" role="img" aria-label="opeco"></div>
        <h2>セッションがありません</h2>
        <p>opecoに表示されたワンショットQRコードをデバイスのカメラで読み取るか、リンクをこのブラウザで開いてください。</p>
      </section>
    </main>
    <template id="card-template">
      <article class="card">
        <img class="session-opeco" src="/opeco/blue.svg" alt="opeco" width="45" height="45">
        <div class="session-panel">
        <div class="card-head">
          <div>
            <h2 class="session-title"></h2>
          </div>
          <div class="card-meta">
            <span class="unresolved-count" hidden></span>
            <span class="session-time relative-time"></span>
            <span class="expiry"></span>
          </div>
        </div>
        <p class="status"></p>
        <section class="notifications" aria-label="通知"></section>
        <section class="request" hidden>
          <div class="request-head">
            <div class="request-content">
              <p class="request-prompt"></p>
              <span class="request-time relative-time"></span>
            </div>
            <button class="request-dismiss dismiss-item" type="button" aria-label="リクエストを閉じる" title="リクエストを閉じる">×</button>
          </div>
          <div class="request-options"></div>
        </section>
        <section class="feedback">
          <button class="feedback-toggle icon-button" type="button" aria-label="メッセージを送る" title="メッセージを送る"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h3v4l5-4h8a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2Z"/></svg></button>
          <form class="feedback-form" hidden>
            <label>このセッションへメッセージを送る
              <textarea class="feedback-message" name="message" maxlength="20000"></textarea>
            </label>
            <label class="feedback-photo">写真を添付（5枚まで）
              <input class="feedback-image" name="image" type="file" accept="image/*" multiple>
            </label>
            <div class="feedback-preview" hidden></div>
            <div class="feedback-actions">
              <button type="submit">送信</button>
              <button class="feedback-cancel" type="button">キャンセル</button>
            </div>
          </form>
        </section>
        </div>
      </article>
    </template>
    <template id="remove-device-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/></svg></template>
    <script type="module" src="/app.js"></script>
  </body>
</html>
