version: 2

project_name: opeco

builds:
  - id: opeco
    main: ./cmd/opeco
    binary: opeco
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    hooks:
      post:
        - cmd: sh scripts/collect-cli-licenses.sh "dist/licenses/{{ .Os }}_{{ .Arch }}"
          output: true
          env:
            - GOOS={{ .Os }}
            - GOARCH={{ .Arch }}

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md
      - src: "dist/licenses/{{ .Os }}_{{ .Arch }}"
        dst: licenses

checksum:
  name_template: checksums.txt
